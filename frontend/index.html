<!doctype html>
<html lang="fr">
  <head>

    <link rel="icon" type="image/jpeg" href="/logo-arina.jpg" />

    <meta name="theme-color" content="#7A2C3E" />
    <title>ARINA — Réinsertion des mineurs et des jeunes vulnérables à Madagascar</title>

    <!-- Domaine de production : remplacé au build par VITE_SITE_URL (voir .env.example) -->
    <link rel="canonical" href="__SITE_URL__/" />
    <!-- Open Graph (Facebook, WhatsApp, LinkedIn…) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ARINA" />
    <meta property="og:title" content="ARINA — Réinsertion des mineurs et des jeunes vulnérables à Madagascar" />

    <meta property="og:url" content="__SITE_URL__/" />
    <meta property="og:locale" content="fr_FR" />
    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="ARINA — Réinsertion des mineurs et des jeunes vulnérables à Madagascar" />

      "logo": "__SITE_URL__/logo-arina.jpg",

      "keywords": "réinsertion, mineurs, prison, enfants orphelins, jeunes vulnérables, Madagascar",
      "foundingDate": "2024",
      "areaServed": "Madagascar",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "Fokontany Tsaramandroso Ambony",
        "addressLocality": "Mahajanga",
        "addressCountry": "MG"
      },
      "telephone": "+261327737489",
      "email": "rasendrazita@gmail.com",
      "sameAs": []

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

         son téléchargement dès le HTML reçu, avant même le JavaScript. -->
